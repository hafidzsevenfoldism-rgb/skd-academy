<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — SKD Academy</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="index.css"/>
</head>
<body>

  <!-- Background bubbles -->
  <div class="bg-bubbles">
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
  </div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <!-- Login Card -->
  <div class="card">

    <!-- Logo -->
    <div class="logo-wrap">
      <div class="logo-badge">
        <div class="skd-letters">SKD</div>
        <div class="academy-letters">ACADEMY</div>
      </div>
    </div>

    <!-- Welcome -->
    <div class="welcome-block">
      <div class="welcome-title">
        Selamat Datang di<br><span>Website SKD Academy</span>
      </div>
      <div class="welcome-sub">Silakan masuk untuk melanjutkan belajar 🎓</div>
    </div>

    <div class="divider"></div>

    <!-- Form -->
    <form id="loginForm">

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email</label>
        <div class="input-wrap">
          <input type="email" id="email" placeholder="nama@email.com" required autocomplete="email"/>
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
          </svg>
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="Masukkan password" required autocomplete="current-password"/>
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <button type="button" class="toggle-pw" id="togglePw" aria-label="Tampilkan/Sembunyikan password">
            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Forgot -->
      <div class="forgot">
        <a href="#">Lupa password?</a>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-login" id="btnLogin">MASUK</button>

    </form>

    <!-- Register -->
    <div class="register-row">
      Belum punya akun? <a href="register.html">Daftar Sekarang</a>
    </div>

    <!-- Footer -->
    <div class="footer-info">
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      Koneksi aman &amp; terenkripsi
    </div>

  </div>

  <script src="api.js"></script>
  <script src="index.js"></script>
</body>
</html>
