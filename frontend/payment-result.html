<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hasil Pembayaran — SKD Academy</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="index.css"/>
</head>
<body>
  <div class="bg-bubbles">
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
  </div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="card" style="text-align:center;">
    <div class="logo-wrap">
      <img src="gambar/gambar1.png" alt="SKD Academy" style="width:190px;height:100px;object-fit:contain;">
    </div>

    <div id="resultContent">
      <div id="loadingMsg" style="padding:40px 0;">
        <div style="width:50px;height:50px;border:4px solid #2a3a50;border-top-color:#4FC3E0;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 20px;"></div>
        <p style="color:#8899aa;">Memverifikasi pembayaran...</p>
      </div>
    </div>
  </div>

  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <script src="api.js"></script>
  <script src="payment-result.js"></script>
