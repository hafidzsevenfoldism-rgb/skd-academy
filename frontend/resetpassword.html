<body>

  <div class="bg-bubbles">
    <div class="bubble"></div>

    <div class="bubble"></div>
  </div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="card" id="resetCard">

    <div class="logo-wrap">
      <img src="gambar/gambar1.png" alt="SKD Academy" style="width:190px;height:100px;object-fit:contain;">
    </div>

    <div class="welcome-block" id="resetWelcome">
      <div class="welcome-title">Reset Password</div>
      <div class="welcome-sub">Masukkan password baru kamu.</div>
    </div>

    <div class="divider"></div>

    <form id="resetForm">
      <div class="form-group">
        <label for="password">Password Baru</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="Minimal 6 karakter" required minlength="6"/>
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
      </div>

      <div class="form-group">
        <label for="password2">Konfirmasi Password</label>
        <div class="input-wrap">
          <input type="password" id="password2" placeholder="Ulangi password baru" required minlength="6"/>
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
      </div>

      <button type="submit" class="btn-login" id="btnReset">Reset Password</button>
    </form>

    <div class="register-row">
      <a href="login.html">← Kembali ke Login</a>
    </div>

    <div class="footer-info">
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      Koneksi aman &amp; terenkripsi
    </div>

  </div>

  <script src="api.js"></script>
  <script src="resetpassword.js"></script>
